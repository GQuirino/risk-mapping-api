spring.application.name=risk-mapping-api
# Em hospedagem (Render, Heroku...) a porta vem da variável PORT
server.port=${PORT:8080}

# Banco MySQL. Você só precisa informar DB_USUARIO, DB_SENHA e DB_NOME (em
# config/application.properties, fora do Git, ou como variáveis de ambiente).
# O endereço do servidor tem padrão local; em produção o render.yaml define DB_HOST, DB_PORTA e DB_SSL.
# Usuário e senha NUNCA vão dentro da URL.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORTA:3306}/${DB_NOME:risk_mapping}?sslMode=${DB_SSL:PREFERRED}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}
# Conexões ociosas são descartadas antes do servidor derrubá-las (evita erro na 1ª requisição)
spring.datasource.hikari.max-lifetime=1500000

# Atrás de proxy/ngrok: usa X-Forwarded-Proto/Host/For (senão o Swagger monta URLs http://
# e o navegador bloqueia). "native" só confia nesses cabeçalhos quando a conexão vem de um
# proxy interno (ex: o agente do ngrok em localhost), então o IP do cliente não é falsificável.
server.forward-headers-strategy=native

# JWT: OBRIGATÓRIO, sem valor padrão (mínimo 32 caracteres).
# Defina em config/application.properties (fora do Git) ou na variável JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=120

# ADMIN criado ao subir a API. A senha é obrigatória: defina app.admin.senha em
# config/application.properties (fora do Git) ou a variável ADMIN_SENHA.
app.admin.email=${ADMIN_EMAIL:admin@riskmapping.com}
app.admin.senha=${ADMIN_SENHA:}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
